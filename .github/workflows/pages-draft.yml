name: Verify and Release FirmLens

on:
  workflow_dispatch:
    inputs:
      deploy_to_pages:
        description: 'Deploy verified ./dist artifact to GitHub Pages (/firm-lens/) after manager acceptance'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-manual-release
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (matches Vite ^20.19.0 || >=22.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium for UI verification
        run: npx playwright install --with-deps chromium

      - name: Run portable unit & core trust-boundary tests
        run: npm test

      - name: Setup research Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify research pipeline (synthetic fixtures, not model validation)
        run: |
          python -m pip install -r tools/requirements-lock.txt
          python -m unittest discover -s tools/tests -v

      - name: Build static bundle for /firm-lens/
        run: npm run build

      - name: Run browser E2E verification against built dist/
        run: npm run test:browser

      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload GitHub Pages artifact (./dist)
        if: ${{ inputs.deploy_to_pages == true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build-and-verify
    if: ${{ inputs.deploy_to_pages == true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
